name: NPOAP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # numpy>=2.4, scipy>=1.17 et astropy>=7.2 exigent Python >= 3.11 (3.10 ne peut pas s'installer)
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements_install_core.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Profil « coeur » (PyPI seul, comme installation.bat) : le requirements.txt complet
        # demande PHOEBE, Git, etc., trop lourds pour les tests unitaires.
        pip install -r requirements_install_core.txt
        pip install "lightkurve>=2.4.0" pytest

    - name: Run unit tests
      env:
        MPLBACKEND: Agg
      run: |
        # -rs : affiche les tests ignorés (skip) ; l'échec d'un test fait échouer le job
        python -m pytest tests/ -v --tb=short -rs
